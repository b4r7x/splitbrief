server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Traefik terminates TLS in front of this container. Relative Location headers
    # keep redirects on the public origin instead of http://<host>:8080/.
    absolute_redirect off;

    charset utf-8;
    charset_types text/plain text/xml application/xml text/css application/javascript application/json;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml text/xml;
    gzip_min_length 256;
    gzip_vary on;

    # The published docs embed no remote images, so img-src stays on the origin.
    set $security_frame_options "DENY";
    set $security_content_security_policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # Security headers (server-level; the include is repeated in every block that
    # sets a header because nginx headers do not inherit once a block sets one).
    include /etc/nginx/snippets/security-headers.conf;

    # Explicit index.html URLs redirect to their directory form, query kept. This
    # matches the raw $request_uri at server level: the `index` directive turns
    # /x/ into an internal /x/index.html request, which a location rule would
    # redirect again. The captured path must not start with // or /\ so the
    # relative Location can never name another host.
    if ($request_uri ~ "^(/(?:[^/?\x5c][^?]*/)?)index\.html(\?.*)?$") {
        return 301 $1$2;
    }

    # Missing pages get a real 404 with the static 404 body; there is no SPA
    # fallback. A directory without an index (/assets/, /licenses/) reads as
    # missing too.
    error_page 404 /404.html;
    error_page 403 =404 /404.html;

    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;

        add_header Cache-Control "no-store" always;
    }

    # No try_files here: the static module answers a directory URL without its
    # trailing slash with a 301 to the slash form (query kept), serves the
    # directory's index.html for the slash form, and 404s everything else.
    location / {
        include /etc/nginx/snippets/security-headers.conf;

        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Content-hashed build output: a changed file gets a new name.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;

        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The deploy workflow polls this file to prove which build is live.
    location = /build-id {
        include /etc/nginx/snippets/security-headers.conf;

        default_type text/plain;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }
}
